<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enciclopedia deMinecraft</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>Enciclopedia de Minecraft</h1>
        <p>Explora el mundo de Minecraft</p>
    </header>

    <main>
        <section class="busqueda">
            <h2>Iniciar sesión</h2>

            <form onsubmit="iniciarSesion(event)">
                <input type="text" id="inputUser"
                    placeholder="Usuario" required>

                <input type="password" id="inputPass"
                    placeholder="Contraseña" required>

                <button type="submit">Ingresar</button>

                <p id="errorMsg" class="d-none">
                    Usuario o contraseña incorrectos.
                </p>
            </form>
        </section>
    </main>

    <script src="js/login.js"></script>
    <script>
        saltarLoginSiAutenticado();
    </script>

</body>
</html>
